# ─────────────────────────────────────────────────────────────
#  부동산 매물 알림 설정
#  가격 단위: 만원 (90000 = 9억), 면적: 전용면적 ㎡
# ─────────────────────────────────────────────────────────────

filters:
  trade_type: 매매
  max_price: 90000          # 9억 이하
  min_area: 84              # 전용 84㎡ 이상 (국평 84.xx 포함)
  discount_pct: 5           # 실거래가보다 5% 이상 싼 매물만

# 실거래가 기준
#   latest : 같은 단지·같은 평형의 가장 최근 실거래 (기본)
#   avg3   : 최근 3건 평균
#   max    : 조회 기간 중 최고가
real_price:
  baseline: latest
  lookback_months: 6        # 이 기간에 거래가 없으면
  fallback_months: 12       # 이 기간까지 넓혀서 찾음
  area_tolerance: 1.0       # 매물 전용면적과 실거래 전용면적 허용 오차(㎡)

sources:
  zigbang: true             # 직방 (호갱노노와 같은 회사, 매물 풀 공유)
  daangn: true              # 당근 부동산 (직거래 매물 위주)
  neonet: true              # 부동산뱅크 (한 번에 250페이지까지, 매물 수 바뀐 단지만 읽음)
  naver: false              # 네이버 부동산: 해외/클라우드 IP 차단 → 국내 PC에서 돌릴 때만 true

# 감시 지역
#   sido/sigungu: 주소 표기 그대로, dongs: 비우면 시군구 전체
#   lawd_cd: 국토부 실거래가 API 시군구 코드(5자리)
regions:
  - { name: 수원 영통구,   sido: 경기도,     sigungu: 수원시 영통구, lawd_cd: "41117" }
  - { name: 수원 권선구,   sido: 경기도,     sigungu: 수원시 권선구, lawd_cd: "41113" }
  - { name: 군포 산본동,   sido: 경기도,     sigungu: 군포시,        lawd_cd: "41410", dongs: [산본동] }
  - { name: 안양 평촌동,   sido: 경기도,     sigungu: 안양시 동안구, lawd_cd: "41173", dongs: [평촌동] }
  # 의왕시에는 '내곡동'이라는 법정동이 없어 '내손동'으로 넣었습니다. 다르면 고쳐주세요.
  - { name: 의왕 내손동,   sido: 경기도,     sigungu: 의왕시,        lawd_cd: "41430", dongs: [내손동] }
  - { name: 서울 광진구,   sido: 서울특별시, sigungu: 광진구,        lawd_cd: "11215" }
  - { name: 서울 강동구,   sido: 서울특별시, sigungu: 강동구,        lawd_cd: "11740" }
  - { name: 서울 송파구,   sido: 서울특별시, sigungu: 송파구,        lawd_cd: "11710" }
  - { name: 서울 강남구,   sido: 서울특별시, sigungu: 강남구,        lawd_cd: "11680" }
  - { name: 서울 서초구,   sido: 서울특별시, sigungu: 서초구,        lawd_cd: "11650" }
  - { name: 서울 동작구,   sido: 서울특별시, sigungu: 동작구,        lawd_cd: "11590" }
  - { name: 서울 용산구,   sido: 서울특별시, sigungu: 용산구,        lawd_cd: "11170" }
  - { name: 성남 수정구,   sido: 경기도,     sigungu: 성남시 수정구, lawd_cd: "41131" }
  - { name: 성남 중원구,   sido: 경기도,     sigungu: 성남시 중원구, lawd_cd: "41133" }
  - { name: 세종 나성동,   sido: 세종특별자치시, sigungu: "",     lawd_cd: "36110", dongs: [나성동], zigbang_gugun: 세종 }
  # danjis: 이 단지만 감시 (단지명에 포함된 글자로 비교)
  - { name: 세종 새롬동,   sido: 세종특별자치시, sigungu: "",     lawd_cd: "36110", dongs: [새롬동], zigbang_gugun: 세종,
      danjis: [새뜸마을6단지, 새뜸마을10단지, 새뜸마을11단지, 새뜸마을14단지] }
  - { name: 성남 분당구,   sido: 경기도,     sigungu: 성남시 분당구, lawd_cd: "41135" }

# 한 번 실행에서 알림이 이보다 많으면 묶어서 요약 메시지로 보냄
max_individual_messages: 15

# ─────────────────────────────────────────────────────────────
#  반전세 감시: 보증금별 '이 월세 이하면 알림' 표 (단위: 만원)
#  표 사이 보증금은 직선 보간, 표 밖은 끝 구간 기울기로 연장
#  min_supply_py: 공급(계약)면적 하한(평), min_exclusive_py: 전용면적 하한(평)
# ─────────────────────────────────────────────────────────────
rent_watch:
  region: { sido: 경기도, sigungu: 수원시 영통구, lawd_cd: "41117", dongs: [이의동, 하동, 원천동] }
